<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador de Vehículos - Extremeña de Camiones</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/pages.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 50px auto;
            padding: 20px;
        }
        .admin-header {
            background: var(--color-primary);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-header-content h1 {
            margin-bottom: 5px;
        }
        .admin-header-content p {
            opacity: 0.9;
            margin: 0;
        }
        .admin-header-actions {
            display: flex;
            gap: 10px;
        }
        .admin-form {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        .form-group label {
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--color-secondary);
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 12px;
            border: 2px solid var(--color-border);
            border-radius: 5px;
            font-size: 16px;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .vehicles-list {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: var(--shadow);
        }
        .vehicle-item {
            border: 1px solid var(--color-border);
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 5px;
            display: grid;
            grid-template-columns: 150px 1fr auto;
            gap: 20px;
            align-items: center;
        }
        .vehicle-item img {
            width: 100%;
            border-radius: 5px;
        }
        .vehicle-info h4 {
            margin-bottom: 10px;
            color: var(--color-secondary);
        }
        .vehicle-info p {
            margin: 5px 0;
            font-size: 14px;
            color: var(--color-text-light);
        }
        .vehicle-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-small {
            padding: 8px 15px;
            font-size: 14px;
        }
        .btn-danger {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }
        .gallery-inputs,
        .features-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .gallery-inputs input,
        .features-inputs input {
            padding: 10px;
        }
        .add-more-btn {
            padding: 8px 15px;
            background: var(--color-secondary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
        .add-more-btn:hover {
            opacity: 0.9;
        }
        /* Modal Styles */
        .vehicle-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            overflow-y: auto;
        }
        .vehicle-modal.active {
            display: block;
        }
        .vehicle-modal-content {
            background: white;
            max-width: 1000px;
            margin: 50px auto;
            padding: 40px;
            border-radius: 10px;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #999;
            cursor: pointer;
            background: none;
            border: none;
        }
        .modal-close:hover {
            color: #333;
        }
        .image-preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        .image-preview {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 5px;
            border: 2px solid var(--color-border);
        }
        .file-input-wrapper {
            position: relative;
            margin-bottom: 10px;
        }
        .file-input-wrapper input[type="file"] {
            width: 100%;
        }
        .upload-btn {
            background: var(--color-secondary);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            margin-top: 5px;
            font-size: 14px;
            border: none;
        }
        .upload-btn:hover {
            opacity: 0.9;
        }
        .add-vehicle-btn-container {
            margin-bottom: 20px;
            text-align: right;
        }
        /* Editor de texto enriquecido (estilo Word) */
        .richtext-toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            padding: 10px;
            background: #f0f0f0;
            border: 2px solid var(--color-border);
            border-bottom: none;
            border-radius: 5px 5px 0 0;
        }
        .richtext-toolbar button {
            width: 36px;
            height: 36px;
            border: 1px solid transparent;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            color: var(--color-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .richtext-toolbar button:hover {
            background: var(--color-border);
        }
        .richtext-toolbar button.active {
            background: var(--color-primary);
            color: white;
        }
        .richtext-toolbar select {
            padding: 0 8px;
            border: 1px solid var(--color-border);
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }
        .richtext-separator {
            width: 1px;
            background: var(--color-border);
            margin: 4px 3px;
        }
        .richtext-editor {
            min-height: 320px;
            max-height: 450px;
            overflow-y: auto;
            padding: 15px;
            border: 2px solid var(--color-border);
            border-radius: 0 0 5px 5px;
            font-size: 15px;
            line-height: 1.6;
        }
        .richtext-editor:focus {
            outline: none;
            border-color: var(--color-primary);
        }
        .richtext-editor p {
            margin-bottom: 10px;
        }
        @media (max-width: 768px) {
            .vehicle-item {
                grid-template-columns: 1fr;
            }
            .vehicle-actions {
                flex-direction: row;
            }
            .vehicle-modal-content {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div class="admin-header-content">
                <h1>Administrador de Vehículos</h1>
                <p>Gestione los vehículos de ocasión disponibles en la web</p>
            </div>
            <div class="admin-header-actions">
                <a href="../index.html" class="btn btn-light">Volver a la web</a>
                <button onclick="logout()" class="btn btn-secondary">Cerrar Sesión</button>
            </div>
        </div>

        <div id="successMessage" class="success-message"></div>
        <div id="errorMessage" class="error-message"></div>

        <!-- Política de Calidad -->
        <div class="add-vehicle-btn-container">
            <button class="btn btn-primary" id="openQualityPolicyBtn">Editar Política de Calidad</button>
        </div>

        <!-- Lista de vehículos -->
        <div class="vehicles-list">
            <div class="add-vehicle-btn-container">
                <button class="btn btn-primary add-vehicle-btn">+ Añadir Vehículo</button>
            </div>
            <h2>Vehículos Actuales</h2>
            <div id="vehiclesList">
                <!-- Los vehículos se cargarán aquí -->
            </div>
        </div>

        <!-- Modal para añadir/editar vehículo -->
        <div id="vehicleModal" class="vehicle-modal">
            <div class="vehicle-modal-content">
                <button class="modal-close">&times;</button>
                <h2 id="formTitle">Añadir Nuevo Vehículo</h2>
                
                <div id="modalSuccessMessage" class="success-message"></div>
                <div id="modalErrorMessage" class="error-message"></div>
                
                <form id="vehicleForm">
                    <input type="hidden" id="vehicleId" name="id">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="category">Categoría *</label>
                            <select id="category" name="category" required>
                                <option value="camiones">Camiones</option>
                                <option value="furgonetas">Furgonetas</option>
                                <option value="maquinaria">Maquinaria</option>
                                <option value="tractores">Tractores</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="brand">Marca *</label>
                            <select id="brand" name="brand" required>
                                <option value="Daf">Daf</option>
                                <option value="Ford Trucks">Ford Trucks</option>
                                <option value="Iveco">Iveco</option>
                                <option value="JCB">JCB</option>
                                <option value="Landini">Landini</option>
                                <option value="Man">Man</option>
                                <option value="Manitou">Manitou</option>
                                <option value="McCormick">McCormick</option>
                                <option value="Mercedes">Mercedes</option>
                                <option value="Merlo">Merlo</option>
                                <option value="Renault Trucks">Renault Trucks</option>
                                <option value="Scania">Scania</option>
                                <option value="Volvo">Volvo</option>
                                <option value="Otros">Otros</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="title">Título del Vehículo *</label>
                        <input type="text" id="title" name="title" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="commercial">Comercial *</label>
                            <input type="text" id="commercial" name="commercial" required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Teléfono *</label>
                            <input type="tel" id="phone" name="phone" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="year">Año *</label>
                            <input type="number" id="year" name="year" min="1990" max="2030" required>
                        </div>

                        <div class="form-group">
                            <label for="km">Kilómetros *</label>
                            <input type="number" id="km" name="km" min="0" required>
                        </div>

                        <div class="form-group">
                            <label for="power">Potencia (CV) *</label>
                            <input type="number" id="power" name="power" min="0" required>
                        </div>

                        <div class="form-group">
                            <label for="euro">Normativa Euro *</label>
                            <select id="euro" name="euro" required>
                                <option value="Euro 3">Euro 3</option>
                                <option value="Euro 4">Euro 4</option>
                                <option value="Euro 5">Euro 5</option>
                                <option value="Euro 6">Euro 6</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="tonnage">Toneladas *</label>
                            <input type="number" id="tonnage" name="tonnage" min="0" step="0.1" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="priceCurrent">Precio Actual (€) *</label>
                            <input type="number" id="priceCurrent" name="priceCurrent" min="0" required>
                        </div>

                        <div class="form-group">
                            <label for="priceOld">Precio Anterior (€)</label>
                            <input type="number" id="priceOld" name="priceOld" min="0">
                        </div>

                        <div class="form-group">
                            <label for="badge">Etiqueta</label>
                            <select id="badge" name="badge">
                                <option value="">Sin etiqueta</option>
                                <option value="OFERTA">OFERTA</option>
                                <option value="NUEVO">NUEVO</option>
                                <option value="RESERVADO">RESERVADO</option>
                                <option value="VENDIDO">VENDIDO</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="mainImage">Imagen Principal *</label>
                        <input type="file" id="mainImage" accept="image/*" required>
                        <div class="image-preview-container" id="mainImagePreview"></div>
                        <input type="hidden" id="image" name="image">
                    </div>

                    <div class="form-group">
                        <label>Galería de Imágenes (4 imágenes recomendadas)</label>
                        <input type="file" id="galleryImages" accept="image/*" multiple>
                        <div class="image-preview-container" id="galleryPreview"></div>
                        <div class="gallery-inputs" id="galleryInputsHidden" style="display:none;">
                            <input type="hidden" name="gallery[]">
                            <input type="hidden" name="gallery[]">
                            <input type="hidden" name="gallery[]">
                            <input type="hidden" name="gallery[]">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="description">Descripción *</label>
                        <textarea id="description" name="description" rows="4" required></textarea>
                    </div>

                    <div class="form-group">
                        <label>Características del Vehículo</label>
                        <div class="features-inputs" id="featuresInputs">
                            <input type="text" name="features[]" placeholder="Ej: Vehículo revisado y certificado">
                            <input type="text" name="features[]" placeholder="Ej: ITV en vigor hasta 2026">
                            <input type="text" name="features[]" placeholder="Ej: Garantía de 12 meses incluida">
                            <input type="text" name="features[]" placeholder="Ej: Aire acondicionado">
                            <input type="text" name="features[]" placeholder="Ej: Posibilidad de financiación">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="featured" name="featured">
                            Destacar en página principal
                        </label>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Guardar Vehículo</button>
                        <button type="button" class="btn btn-secondary" onclick="closeVehicleModal()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal para editar la Política de Calidad -->
        <div id="qualityPolicyModal" class="vehicle-modal">
            <div class="vehicle-modal-content">
                <button class="modal-close" id="closeQualityPolicyModal">&times;</button>
                <h2>Editar Política de Calidad</h2>
                <p>Edite el título y el texto que se muestra en la página pública de Política de Calidad.</p>

                <div id="qualityPolicySuccessMessage" class="success-message"></div>
                <div id="qualityPolicyErrorMessage" class="error-message"></div>

                <form id="qualityPolicyForm">
                    <div class="form-group">
                        <label for="qualityPolicyTitle">Título</label>
                        <input type="text" id="qualityPolicyTitle" name="qualityPolicyTitle" required>
                    </div>

                    <div class="form-group">
                        <label for="qualityPolicyEditor">Texto</label>
                        <div class="richtext-toolbar">
                            <button type="button" data-command="bold" title="Negrita"><strong>B</strong></button>
                            <button type="button" data-command="italic" title="Cursiva"><em>I</em></button>
                            <button type="button" data-command="underline" title="Subrayado"><u>U</u></button>
                            <div class="richtext-separator"></div>
                            <button type="button" data-command="justifyLeft" title="Alinear a la izquierda">⇤</button>
                            <button type="button" data-command="justifyCenter" title="Centrar">≡</button>
                            <button type="button" data-command="justifyRight" title="Alinear a la derecha">⇥</button>
                            <button type="button" data-command="justifyFull" title="Justificar">☰</button>
                            <div class="richtext-separator"></div>
                            <button type="button" data-command="insertUnorderedList" title="Lista con viñetas">•</button>
                            <button type="button" data-command="insertOrderedList" title="Lista numerada">1.</button>
                            <div class="richtext-separator"></div>
                            <select data-command="formatBlock" title="Estilo de párrafo">
                                <option value="p">Párrafo</option>
                                <option value="h2">Título grande</option>
                                <option value="h3">Título mediano</option>
                            </select>
                        </div>
                        <div id="qualityPolicyEditor" class="richtext-editor" contenteditable="true"></div>
                        <input type="hidden" id="qualityPolicyContent" name="qualityPolicyContent" required>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">Guardar Política de Calidad</button>
                        <button type="button" class="btn btn-secondary" id="cancelQualityPolicyBtn">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Verificar autenticación al cargar
        if (sessionStorage.getItem('adminAuth') !== 'true') {
            window.location.href = 'login.html';
        }

        // Variables globales
        let currentVehicles = [];

        // Datos de fallback si no se pueden cargar desde el servidor
        const fallbackVehicles = [
            {
                "id": 1,
                "category": "camiones",
                "title": "RENAULT T 520 4X2 Euro 6 Step E",
                "brand": "Renault Trucks",
                "image": "images/vehicles/renault-t-520.jpg",
                "gallery": ["images/vehicles/renault-t-520.jpg", "images/camion1.jpeg", "images/camion2.jpeg", "images/renault-truck.jpg"],
                "badge": "OFERTA",
                "km": "576884",
                "year": "2021",
                "power": "520",
                "euro": "Euro 6",
                "priceOld": "54000",
                "priceCurrent": "48000",
                "commercial": "Departamento Comercial",
                "phone": "924371718",
                "description": "Camión tractora Renault T 520 en excelente estado, con todas las revisiones al día y listo para trabajar.",
                "features": ["Vehículo revisado y certificado", "ITV en vigor hasta 2026", "Garantía de 12 meses incluida", "Cabina con litera", "Control de crucero adaptativo", "Sistema de frenado ABS + EBS", "Aire acondicionado automático", "Cámara de marcha atrás", "Ordenador de a bordo", "Posibilidad de financiación"],
                "featured": true
            },
            {
                "id": 2,
                "category": "camiones",
                "title": "RENAULT T High 480 4X2 Euro 6 Step E",
                "brand": "Renault Trucks",
                "image": "images/vehicles/renault-t-480.jpg",
                "gallery": ["images/vehicles/renault-t-480.jpg", "images/renault-truck.jpg", "images/camion1.jpeg", "images/camion2.jpeg"],
                "badge": "RESERVADO",
                "km": "567000",
                "year": "2022",
                "power": "480",
                "euro": "Euro 6",
                "priceCurrent": "64000",
                "commercial": "Departamento Comercial",
                "phone": "924371718",
                "description": "Vehículo reservado. Renault T High en perfectas condiciones, con mantenimiento oficial Renault Trucks.",
                "features": ["Vehículo reservado", "Cabina alta con litera XXL", "Sistema Optiroll integrado", "Nevera incorporada", "Calefacción estacionaria", "Sistema multimedia completo", "Asientos con suspensión neumática", "Luces LED de serie", "Mantenimiento oficial", "Próxima entrega programada"],
                "featured": true
            },
            {
                "id": 1784388774842,
                "category": "camiones",
                "title": "Camión Renault Premium 460",
                "brand": "Renault Trucks",
                "image": "images/camion1.jpeg",
                "gallery": ["images/camion1.jpeg", "images/camion2.jpeg", "images/renault-truck.jpg"],
                "badge": "OFERTA",
                "km": "156000",
                "year": "2022",
                "power": "500",
                "euro": "Euro 6",
                "priceOld": "60000",
                "priceCurrent": "54000",
                "commercial": "Departamento Comercial",
                "phone": "924371718",
                "description": "Vehículo de ocasión Renault en excelente estado. Ideal para transporte de larga distancia.",
                "features": ["Revisión completa realizada", "ITV pasada recientemente", "Garantía de 6 meses", "Bajo consumo de combustible", "Cabina espaciosa", "Climatizador automático", "Sistema de navegación GPS", "Bluetooth integrado", "Mantenimiento al día", "Financiación disponible"],
                "featured": false
            }
        ];

        // Cargar vehículos al iniciar
        document.addEventListener('DOMContentLoaded', loadVehicles);

        async function loadVehicles() {
            try {
                console.log('Intentando cargar desde PHP...');
                const response = await fetch('../php/get_vehicles.php');
                
                if (!response.ok) {
                    throw new Error('Error HTTP: ' + response.status);
                }
                
                const data = await response.json();
                console.log('Datos recibidos de PHP:', data);
                
                if (data.success && data.vehicles) {
                    currentVehicles = data.vehicles;
                    displayVehicles(data.vehicles);
                    return;
                }
            } catch (error) {
                console.log('Error con PHP:', error);
                // Si falla PHP, intentar cargar JSON directamente
                try {
                    console.log('Intentando cargar JSON directamente...');
                    const response = await fetch('../data/vehicles.json');
                    
                    if (!response.ok) {
                        throw new Error('Error HTTP: ' + response.status);
                    }
                    
                    const data = await response.json();
                    console.log('Datos recibidos del JSON:', data);
                    
                    if (data.vehicles) {
                        currentVehicles = data.vehicles;
                        displayVehicles(data.vehicles);
                        return;
                    }
                } catch (error2) {
                    console.error('Error al cargar vehículos:', error2);
                }
            }
            
            // Sin datos remotos, mantener el panel vacío hasta una carga manual
            console.log('No hay vehículos disponibles');
            currentVehicles = [];
            displayVehicles([]);
        }

        function displayVehicles(vehicles) {
            const container = document.getElementById('vehiclesList');
            
            if (!container) {
                console.error('Contenedor vehiclesList no encontrado');
                return;
            }
            
            if (!vehicles || vehicles.length === 0) {
                container.innerHTML = '<p>No hay vehículos registrados</p>';
                return;
            }

            console.log(`Mostrando ${vehicles.length} vehículos`);

            try {
                container.innerHTML = vehicles.map(vehicle => `
                    <div class="vehicle-item">
                        <img src="../${vehicle.image}" alt="${vehicle.title}" onerror="this.src='../images/placeholder.jpg'">
                        <div class="vehicle-info">
                            <h4>${vehicle.title}</h4>
                            <p><strong>Categoría:</strong> ${vehicle.category} | <strong>Marca:</strong> ${vehicle.brand}</p>
                            <p><strong>Año:</strong> ${vehicle.year} | <strong>Km:</strong> ${parseInt(vehicle.km).toLocaleString()} km | <strong>Potencia:</strong> ${vehicle.power} CV</p>
                            <p><strong>Comercial:</strong> ${vehicle.commercial || 'No especificado'} | <strong>Teléfono:</strong> ${vehicle.phone || 'No especificado'}</p>
                            <p><strong>Precio:</strong> ${parseInt(vehicle.priceCurrent).toLocaleString()} € ${vehicle.priceOld ? `(antes ${parseInt(vehicle.priceOld).toLocaleString()} €)` : ''}</p>
                            ${vehicle.badge ? `<p><strong>Etiqueta:</strong> ${vehicle.badge}</p>` : ''}
                            <p><strong>Galería:</strong> ${vehicle.gallery ? vehicle.gallery.length : 0} imágenes | <strong>Características:</strong> ${vehicle.features ? vehicle.features.length : 0}</p>
                        </div>
                        <div class="vehicle-actions">
                            <button class="btn btn-primary btn-small" onclick="editVehicle(${vehicle.id})">Editar</button>
                            <button class="btn btn-danger btn-small" onclick="deleteVehicle(${vehicle.id})">Eliminar</button>
                        </div>
                    </div>
                `).join('');
                
                console.log('Vehículos mostrados correctamente');
            } catch (error) {
                console.error('Error al mostrar vehículos:', error);
                container.innerHTML = '<p style="color: red;">Error al mostrar los vehículos</p>';
            }
        }

        // Funciones del modal
        function openVehicleModal() {
            document.getElementById('vehicleModal').classList.add('active');
            document.getElementById('formTitle').textContent = 'Añadir Nuevo Vehículo';
            document.body.style.overflow = 'hidden';
            
            // Limpiar mensajes del modal
            document.getElementById('modalSuccessMessage').style.display = 'none';
            document.getElementById('modalErrorMessage').style.display = 'none';
        }

        function closeVehicleModal() {
            document.getElementById('vehicleModal').classList.remove('active');
            document.body.style.overflow = '';
            
            // Limpiar mensajes del modal
            document.getElementById('modalSuccessMessage').style.display = 'none';
            document.getElementById('modalErrorMessage').style.display = 'none';
            
            resetForm();
        }

        // Preview de imágenes
        document.getElementById('mainImage').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('mainImagePreview').innerHTML = `
                        <img src="${e.target.result}" class="image-preview" alt="Preview">
                    `;
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('galleryImages').addEventListener('change', function(e) {
            const files = e.target.files;
            const preview = document.getElementById('galleryPreview');
            preview.innerHTML = '';
            
            for (let i = 0; i < files.length && i < 4; i++) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.innerHTML += `
                        <img src="${e.target.result}" class="image-preview" alt="Preview ${i+1}">
                    `;
                };
                reader.readAsDataURL(files[i]);
            }
        });

        // Event listeners del modal
        document.querySelector('.add-vehicle-btn').addEventListener('click', openVehicleModal);
        
        document.querySelector('.modal-close').addEventListener('click', closeVehicleModal);
        
        document.querySelector('.vehicle-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeVehicleModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const modal = document.getElementById('vehicleModal');
                if (modal.classList.contains('active')) {
                    closeVehicleModal();
                }
            }
        });

        // Función para subir una imagen
        async function uploadImage(file) {
            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch('../php/upload_image.php', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error('Error del servidor al subir imagen (código ' + response.status + ')');
                }

                const result = await response.json();
                
                if (result.success) {
                    return result.filename;
                } else {
                    throw new Error(result.message || 'Error desconocido al subir imagen');
                }
            } catch (error) {
                console.error('Error al subir imagen:', error);
                if (error.message === 'Failed to fetch') {
                    throw new Error('No se puede conectar con el servidor. Asegúrese de que el servidor PHP esté ejecutándose.');
                }
                throw error;
            }
        }

        // Manejar envío del formulario
        document.getElementById('vehicleForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            try {
                // Subir imagen principal
                const mainImageFile = document.getElementById('mainImage').files[0];
                let mainImagePath = document.getElementById('image').value;
                
                if (mainImageFile) {
                    showModalSuccess('Subiendo imagen principal...');
                    mainImagePath = await uploadImage(mainImageFile);
                }
                
                if (!mainImagePath) {
                    showModalError('Debe seleccionar una imagen principal');
                    return;
                }
                
                // Subir imágenes de galería
                const galleryFiles = document.getElementById('galleryImages').files;
                const galleryPaths = [];
                
                if (galleryFiles.length > 0) {
                    showModalSuccess('Subiendo galería de imágenes...');
                    for (let i = 0; i < galleryFiles.length && i < 4; i++) {
                        const path = await uploadImage(galleryFiles[i]);
                        galleryPaths.push(path);
                    }
                } else {
                    // Si no hay nuevas imágenes, usar las existentes
                    const hiddenInputs = document.querySelectorAll('#galleryInputsHidden input[type="hidden"]');
                    hiddenInputs.forEach(input => {
                        if (input.value) galleryPaths.push(input.value);
                    });
                }
                
                // Si no hay galería, usar la imagen principal
                if (galleryPaths.length === 0) {
                    galleryPaths.push(mainImagePath);
                }
                
                const formData = new FormData(this);
                
                // Recoger características
                const features = Array.from(document.querySelectorAll('input[name="features[]"]'))
                    .map(input => input.value)
                    .filter(val => val.trim() !== '');
                
                const vehicleData = {
                    id: formData.get('id') ? parseInt(formData.get('id')) : Date.now(),
                    category: formData.get('category'),
                    title: formData.get('title'),
                    brand: formData.get('brand'),
                    image: mainImagePath,
                    gallery: galleryPaths,
                    badge: formData.get('badge') || null,
                    km: formData.get('km'),
                    year: formData.get('year'),
                    power: formData.get('power'),
                    euro: formData.get('euro'),
                    tonnage: formData.get('tonnage'),
                    priceOld: formData.get('priceOld') || null,
                    priceCurrent: formData.get('priceCurrent'),
                    commercial: formData.get('commercial') || '',
                    phone: formData.get('phone') || '',
                    description: formData.get('description'),
                    features: features.length > 0 ? features : [
                        'Vehículo revisado',
                        'ITV al día',
                        'Garantía incluida',
                        'Posibilidad de financiación'
                    ],
                    featured: formData.get('featured') === 'on'
                };

                showModalSuccess('Guardando vehículo...');
                const response = await fetch('../php/save_vehicle.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(vehicleData)
                });

                if (!response.ok) {
                    throw new Error('Error del servidor (código ' + response.status + ')');
                }

                const result = await response.json();

                if (result.success) {
                    showSuccess('Vehículo guardado correctamente');
                    closeVehicleModal();
                    loadVehicles();
                } else {
                    showModalError('Error al guardar el vehículo: ' + result.message);
                }
            } catch (error) {
                console.error('Error completo:', error);
                let errorMessage = error.message;
                if (error.message === 'Failed to fetch') {
                    errorMessage = 'No se puede conectar con el servidor. Asegúrese de que el servidor PHP esté ejecutándose en este directorio.';
                }
                showModalError('Error: ' + errorMessage);
            }
        });

        function editVehicle(id) {
            const vehicle = currentVehicles.find(v => v.id == id);
            if (!vehicle) {
                showError('Vehículo no encontrado');
                return;
            }

            // Abrir modal
            openVehicleModal();
            
            // Cambiar título del formulario
            document.getElementById('formTitle').textContent = 'Editar Vehículo';

            // Llenar formulario
            document.getElementById('vehicleId').value = vehicle.id;
            document.getElementById('category').value = vehicle.category;
            document.getElementById('brand').value = vehicle.brand;
            document.getElementById('title').value = vehicle.title;
            document.getElementById('year').value = vehicle.year;
            document.getElementById('km').value = vehicle.km;
            document.getElementById('power').value = vehicle.power;
            document.getElementById('euro').value = vehicle.euro;
            document.getElementById('tonnage').value = vehicle.tonnage || '';
            document.getElementById('priceCurrent').value = vehicle.priceCurrent;
            document.getElementById('priceOld').value = vehicle.priceOld || '';
            document.getElementById('commercial').value = vehicle.commercial || '';
            document.getElementById('phone').value = vehicle.phone || '';
            document.getElementById('badge').value = vehicle.badge || '';
            document.getElementById('image').value = vehicle.image; // Guardar path actual
            document.getElementById('description').value = vehicle.description || '';
            document.getElementById('featured').checked = vehicle.featured || false;

            // Mostrar preview de imagen principal
            if (vehicle.image) {
                document.getElementById('mainImagePreview').innerHTML = `
                    <img src="../${vehicle.image}" class="image-preview" alt="Imagen actual">
                `;
                // No hacer required el input de imagen en edición
                document.getElementById('mainImage').removeAttribute('required');
            }

            // Mostrar preview de galería
            if (vehicle.gallery && vehicle.gallery.length > 0) {
                const preview = document.getElementById('galleryPreview');
                preview.innerHTML = vehicle.gallery.map(img => `
                    <img src="../${img}" class="image-preview" alt="Galería">
                `).join('');
                
                // Guardar paths actuales en inputs hidden
                const hiddenInputs = document.querySelectorAll('#galleryInputsHidden input[type="hidden"]');
                vehicle.gallery.forEach((img, index) => {
                    if (hiddenInputs[index]) {
                        hiddenInputs[index].value = img;
                    }
                });
            }

            // Llenar características
            const featuresInputs = document.querySelectorAll('input[name="features[]"]');
            if (vehicle.features) {
                vehicle.features.forEach((feat, index) => {
                    if (featuresInputs[index]) {
                        featuresInputs[index].value = feat;
                    }
                });
            }
        }

        async function deleteVehicle(id) {
            if (!confirm('¿Está seguro de que desea eliminar este vehículo? Esta acción no se puede deshacer.')) {
                return;
            }

            try {
                const response = await fetch('../php/delete_vehicle.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ id: id })
                });

                const result = await response.json();

                if (result.success) {
                    showSuccess('Vehículo eliminado correctamente');
                    loadVehicles();
                } else {
                    showError('Error al eliminar el vehículo: ' + result.message);
                }
            } catch (error) {
                showError('Error de conexión. Asegúrese de que el servidor está activo.');
            }
        }

        function resetForm() {
            document.getElementById('vehicleForm').reset();
            document.getElementById('vehicleId').value = '';
            document.getElementById('image').value = '';
            document.getElementById('formTitle').textContent = 'Añadir Nuevo Vehículo';
            document.getElementById('mainImage').setAttribute('required', 'required');
            document.getElementById('mainImagePreview').innerHTML = '';
            document.getElementById('galleryPreview').innerHTML = '';
            
            // Limpiar mensajes del modal
            document.getElementById('modalSuccessMessage').style.display = 'none';
            document.getElementById('modalErrorMessage').style.display = 'none';
            
            // Limpiar características
            document.querySelectorAll('input[name="features[]"]').forEach(input => input.value = '');
            
            // Limpiar hidden inputs de galería
            document.querySelectorAll('#galleryInputsHidden input[type="hidden"]').forEach(input => input.value = '');
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => successDiv.style.display = 'none', 5000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }

        function showModalSuccess(message) {
            const successDiv = document.getElementById('modalSuccessMessage');
            const errorDiv = document.getElementById('modalErrorMessage');
            errorDiv.style.display = 'none';
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }

        function showModalError(message) {
            const successDiv = document.getElementById('modalSuccessMessage');
            const errorDiv = document.getElementById('modalErrorMessage');
            successDiv.style.display = 'none';
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            // Scroll al mensaje de error en el modal
            errorDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function logout() {
            if (confirm('¿Está seguro de que desea cerrar sesión?')) {
                sessionStorage.removeItem('adminAuth');
                sessionStorage.removeItem('adminUser');
                sessionStorage.removeItem('loginTime');
                window.location.href = 'login.html';
            }
        }

        // Política de Calidad
        const fallbackQualityPolicy = {
            title: '',
            content: ''
        };

        async function loadQualityPolicy() {
            try {
                const response = await fetch('../php/get_quality_policy.php');

                if (!response.ok) {
                    throw new Error('Error HTTP: ' + response.status);
                }

                const data = await response.json();

                if (data.success) {
                    document.getElementById('qualityPolicyTitle').value = data.title || '';
                    document.getElementById('qualityPolicyEditor').innerHTML = data.content || '';
                    return;
                }

                throw new Error('Respuesta sin éxito del servidor');
            } catch (error) {
                console.log('No se pudo cargar desde el servidor, usando datos de respaldo:', error.message);
                document.getElementById('qualityPolicyTitle').value = fallbackQualityPolicy.title;
                document.getElementById('qualityPolicyEditor').innerHTML = fallbackQualityPolicy.content;
            }
        }

        function openQualityPolicyModal() {
            document.getElementById('qualityPolicyModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('qualityPolicySuccessMessage').style.display = 'none';
            document.getElementById('qualityPolicyErrorMessage').style.display = 'none';
        }

        function closeQualityPolicyModal() {
            document.getElementById('qualityPolicyModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.getElementById('openQualityPolicyBtn').addEventListener('click', openQualityPolicyModal);
        document.getElementById('closeQualityPolicyModal').addEventListener('click', closeQualityPolicyModal);
        document.getElementById('cancelQualityPolicyBtn').addEventListener('click', closeQualityPolicyModal);

        document.getElementById('qualityPolicyModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeQualityPolicyModal();
            }
        });

        // Barra de herramientas del editor de texto enriquecido
        document.querySelectorAll('.richtext-toolbar button[data-command]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('qualityPolicyEditor').focus();
                document.execCommand(btn.dataset.command, false, null);
            });
        });

        document.querySelector('.richtext-toolbar select[data-command]').addEventListener('change', function() {
            document.getElementById('qualityPolicyEditor').focus();
            document.execCommand('formatBlock', false, this.value);
            this.value = 'p';
        });

        document.getElementById('qualityPolicyForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            document.getElementById('qualityPolicyContent').value = document.getElementById('qualityPolicyEditor').innerHTML;

            const policyData = {
                title: document.getElementById('qualityPolicyTitle').value,
                content: document.getElementById('qualityPolicyContent').value
            };

            const successDiv = document.getElementById('qualityPolicySuccessMessage');
            const errorDiv = document.getElementById('qualityPolicyErrorMessage');

            try {
                const response = await fetch('../php/save_quality_policy.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(policyData)
                });

                if (!response.ok) {
                    throw new Error('Error del servidor (código ' + response.status + ')');
                }

                const result = await response.json();

                if (result.success) {
                    errorDiv.style.display = 'none';
                    successDiv.textContent = 'Política de calidad guardada correctamente';
                    successDiv.style.display = 'block';
                } else {
                    successDiv.style.display = 'none';
                    errorDiv.textContent = 'Error al guardar la política de calidad: ' + result.message;
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                successDiv.style.display = 'none';
                errorDiv.textContent = 'Error de conexión. Asegúrese de que el servidor está activo.';
                errorDiv.style.display = 'block';
            }
        });

        // Cargar vehículos al inicio
        loadVehicles();
        loadQualityPolicy();
    </script>
</body>
</html>
